name: Deploy

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  # A rebuild without a code change, for example after content is published in the CMS.
  # Manual: Actions > Deploy > Run workflow. From the CMS: a repository_dispatch of type cms-publish.
  workflow_dispatch:
  repository_dispatch:
    types: [cms-publish]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment: production
    env:
      # Repo variables (Settings > Secrets and variables > Actions > Variables).
      CONTENT_SOURCE: ${{ vars.CONTENT_SOURCE || 'mock' }}
      CMS_API_URL: ${{ vars.CMS_API_URL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm cf:build
      - run: pnpm cf:deploy
